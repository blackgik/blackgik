<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Chinedum Echendu — Software Developer">
  <title>Chinedum Echendu — Software Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06102C"/>
      <stop offset="0.55" stop-color="#08173D"/>
      <stop offset="1" stop-color="#172B5C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1FCFC3"/>
      <stop offset="0.5" stop-color="#2FA6EC"/>
      <stop offset="1" stop-color="#7C8CFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0; 0.5 0; -0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#1FCFC3" stop-opacity="0.55"/><stop offset="1" stop-color="#1FCFC3" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#2FA6EC" stop-opacity="0.5"/><stop offset="1" stop-color="#2FA6EC" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC"><stop offset="0" stop-color="#7C8CFF" stop-opacity="0.35"/><stop offset="1" stop-color="#7C8CFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="24"/></clipPath>
    <style>
      .rise { opacity: 0; animation: rise 1s cubic-bezier(.22,1,.36,1) forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .85s }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      .name { font: 800 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: -2px; fill: #ffffff; }
      .role { font: 600 26px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: url(#accent); }
      .meta { font: 500 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; fill-opacity: .62; }
      .code { font: 500 15px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .float { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float 7s ease-in-out infinite reverse; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- drifting light -->
    <circle cx="120" cy="40" r="260" fill="url(#glowA)">
      <animate attributeName="cx" values="120;260;120" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;110;40" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="300" r="280" fill="url(#glowB)">
      <animate attributeName="cx" values="1080;940;1080" dur="19s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="-20" r="200" fill="url(#glowC)">
      <animate attributeName="cy" values="-20;60;-20" dur="22s" repeatCount="indefinite"/>
    </circle>

    <!-- copy -->
    <g transform="translate(70 0)">
      <text x="0" y="98" class="meta rise d1">Hi there, I'm</text>
      <text x="-3" y="166" class="name rise d2">Chinedum Echendu</text>
      <text x="0" y="210" class="role rise d3">Software Developer · Backend &amp; Full-stack</text>
      <text x="0" y="256" class="meta rise d4">Node.js · TypeScript · React · Next.js · MySQL · Docker</text>
      <rect x="0" y="276" width="0" height="4" rx="2" fill="url(#accent)">
        <animate attributeName="width" from="0" to="180" dur="1.2s" begin="0.9s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      </rect>
    </g>

    <!-- code window -->
    <g transform="translate(800 62)"><g class="float">
      <rect width="330" height="196" rx="16" fill="#0B1A40" stroke="#ffffff" stroke-opacity=".1"/>
      <circle cx="22" cy="22" r="5" fill="#FF5F57"/><circle cx="40" cy="22" r="5" fill="#FEBC2E"/><circle cx="58" cy="22" r="5" fill="#28C840"/>
      <text x="290" y="27" class="code" fill="#ffffff" fill-opacity=".35" text-anchor="end">dev.ts</text>
      <g class="code" xml:space="preserve">
        <text x="22" y="66"><tspan fill="#7C8CFF">const</tspan><tspan fill="#ffffff"> dev = {</tspan></text>
        <text x="40" y="92"><tspan fill="#2FA6EC">builds</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#1FCFC3">"products people use"</tspan><tspan fill="#ffffff">,</tspan></text>
        <text x="40" y="118"><tspan fill="#2FA6EC">loves</tspan><tspan fill="#ffffff">: [</tspan><tspan fill="#1FCFC3">"APIs"</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#1FCFC3">"systems"</tspan><tspan fill="#ffffff">],</tspan></text>
        <text x="40" y="144"><tspan fill="#2FA6EC">learning</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#1FCFC3">"AWS SysOps"</tspan><tspan fill="#ffffff">,</tspan></text>
        <text x="22" y="170" fill="#ffffff">};<tspan class="caret" fill="#1FCFC3"> ▍</tspan></text>
      </g>
    </g></g>

    <!-- floating chips -->
    <g transform="translate(735 238)"><g class="float2">
      <rect width="190" height="40" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#1FCFC3" stroke-opacity=".45"/>
      <circle cx="22" cy="20" r="5" fill="#1FCFC3"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="36" y="26" class="meta" style="font-size:15px" fill-opacity=".85">open to collaborate</text>
    </g></g>
  </g>
</svg>
